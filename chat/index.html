<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mistral Chat</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1d1d1f; color: #f5f5f7; }
      .bubble.user { background: #0a84ff; }
      .bubble.assistant { background: #2c2c2e; }
      input, button { background: #2c2c2e; color: #f5f5f7; border-color: #48484a; }
    }
    main { width: 100%; max-width: 720px; display: flex; flex-direction: column; padding: 1rem; gap: 0.75rem; }
    h1 { font-size: 1.25rem; margin: 0.5rem 0 0; }
    #status { font-size: 0.8rem; opacity: 0.7; }
    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.5rem 0;
      min-height: 40vh;
    }
    .bubble {
      max-width: 80%;
      padding: 0.6rem 0.9rem;
      border-radius: 1rem;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .bubble.user { align-self: flex-end; background: #0a84ff; color: #fff; }
    .bubble.assistant { align-self: flex-start; background: #e5e5ea; }
    .bubble.error { align-self: flex-start; background: #ffd6d6; color: #900; }
    form { display: flex; gap: 0.5rem; }
    input {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border-radius: 0.75rem;
      border: 1px solid #c7c7cc;
      font-size: 1rem;
    }
    button {
      padding: 0.7rem 1.2rem;
      border-radius: 0.75rem;
      border: 1px solid #c7c7cc;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>Mistral Chat</h1>
    <div id="status">lädt …</div>
    <div id="messages"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Nachricht an mistral-small-latest …" autocomplete="off" autofocus />
      <button id="send" type="submit">Senden</button>
    </form>
  </main>
  <script>
    // Der API-Key liegt ausschliesslich auf dem Server – der Browser ruft nur /api/chat auf.
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const status = document.getElementById('status');
    const history = [];

    async function refreshStatus() {
      try {
        const res = await fetch('/health');
        const data = await res.json();
        status.textContent = data.ok
          ? 'Modell: ' + data.model + ' – API-Key auf dem Server ' + (data.hasKey ? 'gesetzt' : 'FEHLT (MISTRAL_API_KEY nicht gesetzt)')
          : 'Server nicht erreichbar';
      } catch {
        status.textContent = 'Server nicht erreichbar';
      }
    }

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = 'bubble ' + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      send.disabled = true;
      addBubble('user', text);
      history.push({ role: 'user', content: text });
      const pending = addBubble('assistant', '…');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        pending.textContent = data.reply;
        history.push({ role: 'assistant', content: data.reply });
      } catch (err) {
        pending.className = 'bubble error';
        pending.textContent = String(err && err.message ? err.message : err);
        history.pop();
      } finally {
        send.disabled = false;
        input.focus();
        refreshStatus();
      }
    });

    refreshStatus();
  </script>
</body>
</html>
